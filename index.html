<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scrappy Whiteboard — ICM + Antigravity Spatial Canvas</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
        background: #0f172a;
        color: #f8fafc;
        user-select: none;
      }
      @keyframes pulseGlow {
        0%, 100% { box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.4), 0 8px 24px rgba(15, 23, 42, 0.5); }
        50% { box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.85), 0 8px 30px rgba(56, 189, 248, 0.35); }
      }
      @keyframes dashFlow {
        to {
          stroke-dashoffset: -24;
        }
      }
      .edge-animated {
        stroke-dasharray: 6 6;
        animation: dashFlow 0.8s linear infinite;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
